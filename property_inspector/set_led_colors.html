<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set LED Colors</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16181c;
      --shell: #262930;
      --edge: #34383f;
      --face: #121418;
      --key: #1c1f24;
      --text: #e8eaed;
      --muted: #8b9099;
      --focus: #7ea6f5;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.45 system-ui, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      max-width: 330px;
      margin: 0 auto 12px;
    }

    h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
    }

    #status {
      color: var(--muted);
      font-size: 11px;
    }

    /* The map follows the M18: one light bar around the chassis edge, a 5x3 key
       field, and three buttons flanked by the two inner light cutouts. */
    .device {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-rows: auto minmax(0, 1fr) auto;
      max-width: 330px;
      margin: 0 auto;
      padding: 7px;
      border: 1px solid var(--edge);
      border-radius: 14px;
      background: var(--shell);
    }

    /* The horizontal runs span the full width so the bar closes at the corners. */
    .bar-top { grid-area: 1 / 1 / 2 / 4; }
    .bar-bottom { grid-area: 3 / 1 / 4 / 4; }
    .bar-left { grid-area: 2 / 1 / 3 / 2; }
    .bar-right { grid-area: 2 / 3 / 3 / 4; }
    .face { grid-area: 2 / 2 / 3 / 3; }

    .bar { display: grid; gap: 2px; }
    .bar-top, .bar-bottom { grid-auto-flow: column; grid-auto-columns: 1fr; }
    .bar-left, .bar-right { grid-auto-flow: row; grid-auto-rows: 1fr; }

    /* One segment per LED. */
    .led {
      --color: #780000;
      position: relative;
      display: flex;
    }

    input[type="color"] {
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .led input[type="color"] {
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
    }

    .bar-top input[type="color"],
    .bar-bottom input[type="color"] { width: 100%; height: 10px; }

    .bar-left input[type="color"],
    .bar-right input[type="color"] { width: 10px; height: 100%; min-height: 20px; }

    .bar-top .led:first-child input { border-top-left-radius: 7px; }
    .bar-top .led:last-child input { border-top-right-radius: 7px; }
    .bar-bottom .led:first-child input { border-bottom-left-radius: 7px; }
    .bar-bottom .led:last-child input { border-bottom-right-radius: 7px; }

    .led input[type="color"]:hover:not(:disabled) {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.5);
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 0; border-radius: inherit; }
    input[type="color"]::-moz-color-swatch { border: 0; border-radius: inherit; }

    input:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    input:disabled,
    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .face {
      display: grid;
      gap: 8px;
      margin: 7px;
      padding: 8px;
      border-radius: 8px;
      background: var(--face);
      box-shadow: inset 0 0 0 1px #22252b;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .keys span {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--key);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 8px;
    }

    .button-row .led { justify-self: stretch; justify-content: center; }

    .button-row .led input[type="color"] {
      width: 100%;
      max-width: 38px;
      height: 5px;
      border-radius: 3px;
    }

    .knob {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #24272d;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 330px;
      margin: 18px auto 0;
    }

    .swatch {
      position: relative;
      width: 44px;
      height: 30px;
    }

    .swatch input[type="color"] {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--edge);
    }

    /* The picker can only show one color, so when the LEDs differ the swatch is
       covered with a struck-through plate instead of a misleading color. */
    .swatch[data-mixed] .plate {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      background:
        linear-gradient(115deg, transparent calc(50% - 1px), var(--muted) calc(50% - 1px), var(--muted) calc(50% + 1px), transparent calc(50% + 1px)),
        var(--key);
      box-shadow: 0 0 0 1px var(--edge);
      pointer-events: none;
    }

    .controls label {
      cursor: pointer;
    }

    @media (max-width: 300px) {
      body { padding: 12px 8px; }
      .device { padding: 6px; }
      .face { margin: 6px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>LED colors</h1>
    <span id="status">Connecting</span>
  </header>

  <main>
    <section class="device" aria-label="M18 LED layout">
      <div class="bar bar-top" id="barTop"></div>
      <div class="bar bar-left" id="barLeft"></div>
      <div class="bar bar-right" id="barRight"></div>
      <div class="bar bar-bottom" id="barBottom"></div>

      <div class="face">
        <div class="keys" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="button-row" id="buttonRow">
          <div class="knob" aria-hidden="true"></div>
          <div class="knob" aria-hidden="true"></div>
          <div class="knob" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section class="controls">
      <span class="swatch" id="applyAllSwatch">
        <input type="color" id="applyAllColor" value="#780000" aria-label="Set every LED to one color">
        <span class="plate" aria-hidden="true"></span>
      </span>
      <label for="applyAllColor">Set every LED to one color</label>
    </section>
  </main>

  <script>
    const LED_COUNT = 24;
    const DEFAULT_COLOR = '#780000';
    // LEDs 1-22 wrap the chassis; 23 and 24 are the cutouts beside the buttons.
    const LED_BARS = {
      barTop: [21, 20, 19, 18, 17, 16, 15],
      barLeft: [22, 1, 2, 3],
      barRight: [14, 13, 12, 11],
      barBottom: [4, 5, 6, 7, 8, 9, 10],
    };
    const INNER_LEDS = [23, 24];
    const COLOR_PATTERN = /^#[0-9a-fA-F]{6}$/;

    let websocket;
    let context;
    let actionSettings = {};
    let settingsLoaded = false;

    const status = document.getElementById('status');
    const buttonRow = document.getElementById('buttonRow');
    const applyAllSwatch = document.getElementById('applyAllSwatch');
    const applyAllColor = document.getElementById('applyAllColor');

    function ledSegment(number) {
      const label = document.createElement('label');
      label.className = 'led';
      label.innerHTML = `<input type="color" id="led${number - 1}" value="${DEFAULT_COLOR}" aria-label="LED ${number}">`;
      return label;
    }

    for (const [barId, numbers] of Object.entries(LED_BARS)) {
      const bar = document.getElementById(barId);
      for (const number of numbers) bar.appendChild(ledSegment(number));
    }
    // One cutout on each side of the three buttons.
    buttonRow.prepend(ledSegment(INNER_LEDS[0]));
    buttonRow.append(ledSegment(INNER_LEDS[1]));

    function setLed(index, color) {
      document.getElementById(`led${index}`).value = color;
    }

    function enableControls(enabled) {
      document.querySelectorAll('input[type="color"]').forEach(control => {
        control.disabled = !enabled;
      });
      status.textContent = enabled ? '' : 'Connecting';
    }
    enableControls(false);

    function isPalette(colors) {
      return Array.isArray(colors)
        && colors.length === LED_COUNT
        && colors.every(color => typeof color === 'string' && COLOR_PATTERN.test(color));
    }

    function colors() {
      return Array.from({ length: LED_COUNT }, (_, index) => document.getElementById(`led${index}`).value);
    }

    // The all-LEDs picker tracks the palette when it is uniform; otherwise it
    // shows the mixed plate, since one swatch cannot stand for 24 colors.
    function refreshApplyAll() {
      const palette = colors();
      const uniform = palette.every(color => color === palette[0]);
      applyAllSwatch.toggleAttribute('data-mixed', !uniform);
      if (uniform) applyAllColor.value = palette[0];
    }

    function displaySettings(settings) {
      actionSettings = settings ?? {};
      const palette = isPalette(actionSettings.ledColors)
        ? actionSettings.ledColors.map(color => color.toLowerCase())
        : Array(LED_COUNT).fill(DEFAULT_COLOR);
      palette.forEach((color, index) => setLed(index, color));
      refreshApplyAll();
    }

    function saveSettings() {
      if (!settingsLoaded || !websocket || websocket.readyState !== WebSocket.OPEN) return;

      actionSettings = { ...actionSettings, ledColors: colors() };
      websocket.send(JSON.stringify({
        event: 'setSettings',
        context,
        payload: actionSettings,
      }));
    }

    function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
      context = inUUID;

      try {
        const actionInfo = JSON.parse(inActionInfo);
        const settings = actionInfo?.payload?.settings ?? {};
        displaySettings(settings);
      } catch (error) {
        console.error('Unable to read action settings', error);
      }

      websocket = new WebSocket(`ws://localhost:${inPort}`);
      websocket.addEventListener('open', () => {
        websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: context }));
        // Fetch the host's saved value; the editor's initial snapshot can be stale.
        // Opening an inspector must never write defaults over an existing palette.
        websocket.send(JSON.stringify({ event: 'getSettings', context }));
      });
      websocket.addEventListener('message', event => {
        const message = JSON.parse(event.data);
        if (message.event === 'didReceiveSettings' && message.context === context && message.payload) {
          displaySettings(message.payload.settings);
          settingsLoaded = true;
          enableControls(true);
        }
      });
      websocket.addEventListener('close', () => {
        settingsLoaded = false;
        enableControls(false);
      });
    }

    document.querySelector('.device').addEventListener('change', event => {
      if (!event.target.matches('.led input[type="color"]')) return;
      refreshApplyAll();
      saveSettings();
    });

    function applyToAll() {
      for (let index = 0; index < LED_COUNT; index += 1) {
        setLed(index, applyAllColor.value);
      }
      applyAllSwatch.removeAttribute('data-mixed');
    }

    // Both here and on the individual LEDs, the color lands when the picker is
    // committed; nothing is applied while the dialog is still open.
    applyAllColor.addEventListener('change', () => {
      applyToAll();
      saveSettings();
    });
  </script>
</body>
</html>
