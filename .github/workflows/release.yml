name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Test versioning and build without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Cache Cargo dependencies and builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu24-zig0.16.0-sdk11.3-zigbuild0.23.4
          cache-bin: false
          workspaces: |
            . -> target/plugin-linux
            . -> target/plugin-linux-arm64
            . -> target/plugin-mac
            . -> target/plugin-win
      - name: Install release tools
        uses: taiki-e/install-action@v2.87.9
        with:
          tool: git-cliff@2.14.1,cargo-zigbuild@0.23.4
      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Cache macOS SDK
        id: macos-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/MacOSX11.3.sdk
          key: macos-sdk-11.3-v1
      - name: Download macOS SDK
        if: steps.macos-sdk.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz \
            --output "$RUNNER_TEMP/macos-sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/macos-sdk.tar.xz" -C "$RUNNER_TEMP"
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 -c '
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          if git("status", "--porcelain", "--untracked-files=no"):
              raise SystemExit("Commit your changes before testing a release")
          cargo = Path("Cargo.toml").read_text()
          lock = Path("Cargo.lock").read_text()
          manifest = Path("manifest.json").read_text()
          package = tomllib.loads(cargo)["package"]
          current = package["version"]
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", current), "Expected a stable version"
          assert json.loads(manifest)["Version"] == current, "Manifest version mismatch"
          assert [p["version"] for p in tomllib.loads(lock)["package"] if p["name"] == package["name"]] == [current], "Lockfile version mismatch"
          previous = "v" + current
          git("merge-base", "--is-ancestor", previous, "HEAD")
          assert git("rev-list", f"{previous}..HEAD"), "No new commits to release"
          tag = git("cliff", "--config", "cliff.toml", "--topo-order", "--use-branch-tags", "--bump", os.environ["BUMP"], "--bumped-version")
          assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag), "git-cliff returned an invalid version"
          version = tag.removeprefix("v")
          assert tuple(map(int, version.split("."))) > tuple(map(int, current.split("."))), "Version must increase"
          assert not git("tag", "--list", tag), f"Tag {tag} already exists"

          def replace_version(text, pattern):
              result, count = re.subn(pattern, lambda m: m[1] + json.dumps(version), text, flags=re.M)
              assert count == 1, "Expected exactly one version field"
              return result

          updates = {
              "Cargo.toml": replace_version(cargo, r"(\[package\][\s\S]*?^version = )\"[^\"\n]+\""),
              "Cargo.lock": replace_version(lock, r"(\[\[package\]\]\nname = \"" + re.escape(package["name"]) + r"\"\nversion = )\"[^\"\n]+\""),
              "manifest.json": replace_version(manifest, r"(^\s*\"Version\": )\"[^\"\n]+\""),
          }
          for filename, content in updates.items():
              Path(filename).write_text(content)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nprevious={previous}\n")
          print(f"{previous} -> {tag}")
          '
      - name: Generate release notes and update changelog
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git cliff "$PREVIOUS_TAG..HEAD" --config cliff.toml --tag "$TAG" --strip all --output "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          git cliff "$PREVIOUS_TAG..HEAD" --config cliff.toml --tag "$TAG" --prepend CHANGELOG.md
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Build and package all platforms
        env:
          SDKROOT: ${{ runner.temp }}/MacOSX11.3.sdk
        run: just package-native
      - name: Check archive
        run: unzip -t build/opendeck-m18.plugin.zip
      - name: Commit version and create local tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock manifest.json CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
      - name: Push version and tag
        if: ${{ !inputs.dry-run && !env.ACT }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || {
            echo 'main changed during the build. Start a new release run.'
            exit 1
          }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create and publish GitHub release
        if: ${{ !inputs.dry-run && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$TAG" build/opendeck-m18.plugin.zip 40-opendeck-m18.rules
          gh release edit "$TAG" --draft=false --latest
