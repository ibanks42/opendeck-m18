name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Test versioning and build without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 -c '
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          if git("status", "--porcelain", "--untracked-files=no"):
              raise SystemExit("Commit your changes before testing a release")
          cargo = Path("Cargo.toml").read_text()
          lock = Path("Cargo.lock").read_text()
          manifest = Path("manifest.json").read_text()
          package = tomllib.loads(cargo)["package"]
          current = package["version"]
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", current), "Expected a stable version"
          assert json.loads(manifest)["Version"] == current, "Manifest version mismatch"
          assert [p["version"] for p in tomllib.loads(lock)["package"] if p["name"] == package["name"]] == [current], "Lockfile version mismatch"
          parts = list(map(int, current.split(".")))
          index = {"major": 0, "minor": 1, "patch": 2}[os.environ["BUMP"]]
          parts[index] += 1
          parts[index + 1:] = [0] * (2 - index)
          version = ".".join(map(str, parts))
          previous, tag = "v" + current, "v" + version
          git("merge-base", "--is-ancestor", previous, "HEAD")
          assert not git("tag", "--list", tag), f"Tag {tag} already exists"
          assert git("rev-list", f"{previous}..HEAD"), "No new commits to release"

          def replace_version(text, pattern):
              result, count = re.subn(pattern, lambda m: m[1] + json.dumps(version), text, flags=re.M)
              assert count == 1, "Expected exactly one version field"
              return result

          updates = {
              "Cargo.toml": replace_version(cargo, r"(\[package\][\s\S]*?^version = )\"[^\"\n]+\""),
              "Cargo.lock": replace_version(lock, r"(\[\[package\]\]\nname = \"" + re.escape(package["name"]) + r"\"\nversion = )\"[^\"\n]+\""),
              "manifest.json": replace_version(manifest, r"(^\s*\"Version\": )\"[^\"\n]+\""),
          }
          for filename, content in updates.items():
              Path(filename).write_text(content)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nprevious={previous}\n")
          print(f"{previous} -> {tag}")
          '
      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.14.1
          config: cliff.toml
          args: ${{ steps.version.outputs.previous }}..HEAD --tag ${{ steps.version.outputs.tag }} --strip all
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
      - name: Show release notes
        run: |
          test -s "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Build and package all platforms
        run: just package
      - name: Check archive
        run: unzip -t build/opendeck-m18.plugin.zip
      - name: Commit version and create local tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock manifest.json
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
      - name: Push version and tag
        if: ${{ !inputs.dry-run && !env.ACT }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || {
            echo 'main changed during the build. Start a new release run.'
            exit 1
          }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create and publish GitHub release
        if: ${{ !inputs.dry-run && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$TAG" build/opendeck-m18.plugin.zip 40-opendeck-m18.rules
          gh release edit "$TAG" --draft=false --latest
