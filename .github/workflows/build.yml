name: Build plugin

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build all platforms from Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4
      - name: Build and package all platforms
        run: just package
      - name: Check archive
        run: unzip -t build/opendeck-m18.plugin.zip
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !env.ACT }}
        with:
          name: plugin-package
          path: build/opendeck-m18.plugin.zip
          if-no-files-found: error
