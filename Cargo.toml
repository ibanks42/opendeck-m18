[package]
name = "opendeck-m18"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["ibanks42"]
repository = "https://github.com/ibanks42/opendeck-m18"

[dependencies]
data-url = "0.3.2"
futures-lite = "2.6.1"
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "jpeg",
] }
log = "0.4.34"
mirajazz = "0.16.2"
openaction = "2.7.0"
serde_json = "1.0.151"
simplelog = "0.12.2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
